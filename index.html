<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buffet Fadson Festas — Diadema</title>
<meta name="description" content="Buffet Fadson Festas em Diadema: festas infantis, 15 anos, casamentos e buffet a domicílio. Nota 4,8 no Google. Agende sua visita pelo WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,400;1,9..144,600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --plum:#2A0619; --plum2:#3E0C26; --cream:#FFF8EF; --cream2:#F6EEDF;
  --pink:#E36CC0; --pinkd:#C54BA2; --lime:#9CCB4A; --limed:#6E9E2A;
  --yellow:#F6DE5C; --purple:#7A55A0; --blue:#6AAEE0; --orange:#E09042; --red:#CF5560;
  --ink:#2A1733; --muted:#7B6A80;
  --wa:#25D366;
  --ff-d:'Fraunces',Georgia,serif; --ff:'Outfit',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:auto;-webkit-text-size-adjust:100%}
body{font-family:var(--ff);color:var(--ink);background:var(--cream);overflow-x:hidden;line-height:1.5}
img{max-width:100%;display:block}
a{color:inherit}
.serif{font-family:var(--ff-d)}
em{font-style:italic;font-family:var(--ff-d)}

/* progress rainbow */
#progress{position:fixed;top:0;left:0;height:4px;width:100%;z-index:100;transform-origin:0 50%;transform:scaleX(0);
  background:linear-gradient(90deg,var(--red),var(--orange),var(--yellow),var(--lime),var(--blue),var(--purple),var(--pink))}

/* nav */
.nav{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:90;display:flex;align-items:center;gap:14px;
  padding:8px 8px 8px 18px;border-radius:999px;background:rgba(36,17,46,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.12);color:#fff;transition:background .4s,color .4s;width:max-content;max-width:calc(100% - 24px)}
.nav.light{background:rgba(255,248,239,.75);color:var(--ink);border-color:rgba(42,23,51,.08)}
.nav .brand{font-family:var(--ff-d);font-weight:600;font-size:17px;letter-spacing:.2px;white-space:nowrap}
.nav .brand b{color:var(--pink)}
.nav a.cta{background:var(--wa);color:#fff;text-decoration:none;font-weight:600;font-size:14px;padding:9px 16px;border-radius:999px;display:flex;gap:8px;align-items:center;white-space:nowrap}
.wa-ico{width:18px;height:18px;flex:none}

/* ================= HERO ================= */
#hero{position:relative;height:100vh;height:100lvh;overflow:hidden;background:#24010F;color:#fff}
#hero .stage{position:absolute;inset:0;display:grid;place-items:center}
.glow{position:absolute;width:70vmax;height:70vmax;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,206,120,.35) 0%,rgba(255,150,90,.12) 28%,rgba(36,17,46,0) 62%);left:50%;top:58%;transform:translate(-50%,-50%)}
.vela-wrap{position:absolute;inset:0;display:flex;justify-content:center;pointer-events:none}
.vela{position:relative;height:125%;aspect-ratio:941/1672;margin-top:calc(62vh - 0.30 * 125vh);flex:none;transform-origin:49.6% 30%;
  -webkit-mask-image:radial-gradient(ellipse 52% 62% at 50% 42%,#000 55%,transparent 100%);mask-image:radial-gradient(ellipse 52% 62% at 50% 42%,#000 55%,transparent 100%)}
.vela img{width:100%;height:100%;object-fit:cover}
.vglow{position:absolute;left:49.6%;top:30%;width:42%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(255,200,120,.55),rgba(255,140,60,.18) 40%,transparent 70%);mix-blend-mode:screen;animation:breathe 2.2s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.75;transform:translate(-50%,-50%) scale(1)}35%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}70%{opacity:.85;transform:translate(-50%,-50%) scale(.96)}}
.flame{transform-origin:50% 90%;animation:flick 1.6s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1,1) rotate(-1deg)}25%{transform:scale(.94,1.06) rotate(1.5deg)}50%{transform:scale(1.04,.96) rotate(-2deg)}75%{transform:scale(.97,1.04) rotate(1deg)}}
.hero-copy{position:absolute;left:0;right:0;top:15%;text-align:center;padding:0 22px}
.kicker{font-size:12px;letter-spacing:.32em;text-transform:uppercase;opacity:.7;font-weight:500}
.hero-copy h1{font-family:var(--ff-d);font-weight:400;font-size:clamp(38px,7.4vw,96px);line-height:1.02;margin-top:16px;letter-spacing:-.01em}
.hero-copy h1 em{color:var(--yellow)}
.hero-copy2{opacity:0}
.hero-copy2 h2{font-family:var(--ff-d);font-weight:400;font-size:clamp(30px,5.4vw,70px);line-height:1.06}
.hero-copy2 h2 em{color:var(--pink)}
.scroll-hint{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:.25em;text-transform:uppercase;opacity:.65;display:flex;flex-direction:column;align-items:center;gap:10px}
.scroll-hint i{width:1px;height:38px;background:linear-gradient(#fff,transparent);animation:drip 1.8s ease-in-out infinite;transform-origin:top}
@keyframes drip{0%{transform:scaleY(0)}60%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}
.daylight{position:absolute;inset:0;background:var(--cream);opacity:0}
.rainbow{position:absolute;left:-5%;width:110%;bottom:-6%;height:auto}
.rainbow path{fill:none;stroke-linecap:butt}
.balloon{position:absolute;bottom:-30vh;width:clamp(60px,9vw,120px)}
.reveal3{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:0 22px;opacity:0;color:var(--ink)}
.reveal3 h2{font-family:var(--ff-d);font-weight:400;font-size:clamp(34px,6vw,84px);line-height:1.02}
.reveal3 h2 em{color:var(--pinkd)}
.reveal3 p{margin-top:14px;color:var(--muted);font-size:clamp(15px,1.6vw,19px)}

/* ================= CAP 1: FABI ================= */
section{position:relative}
.chap{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--pinkd);font-weight:600;display:flex;align-items:center;gap:12px}
.chap::before{content:"";width:28px;height:2px;background:currentColor}
#fabi{padding:16vh 6vw 12vh;display:grid;grid-template-columns:1.05fr .95fr;gap:5vw;align-items:center;max-width:1300px;margin:0 auto}
#fabi h2{font-family:var(--ff-d);font-weight:400;font-size:clamp(34px,4.8vw,66px);line-height:1.04;margin:18px 0 22px}
#fabi h2 em{color:var(--pinkd)}
#fabi p{font-size:clamp(16px,1.35vw,19px);color:#4d3d55;max-width:540px;margin-bottom:14px}
.fabi-wrap{position:relative;aspect-ratio:1/1.1}
.fabi-wrap .blob{position:absolute;inset:6% 4% 4% 8%;border-radius:46% 54% 50% 50%/55% 48% 52% 45%;
  background:radial-gradient(circle at 30% 30%,#fbe3f3,#f4c5e6 45%,#e9f3d6 100%)}
.fabi-wrap img{position:absolute;left:50%;bottom:0;height:104%;width:auto;transform:translateX(-50%);filter:drop-shadow(0 30px 40px rgba(60,20,70,.18))}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:30px;max-width:540px}
.stat{background:#fff;border-radius:18px;padding:16px 14px;box-shadow:0 1px 0 rgba(42,23,51,.06),0 12px 30px -18px rgba(42,23,51,.3)}
.stat b{display:block;white-space:nowrap;font-family:var(--ff-d);font-size:clamp(26px,2.6vw,36px);font-weight:600;line-height:1}
.stat span{font-size:12.5px;color:var(--muted);display:block;margin-top:6px;line-height:1.3}
.stat .stars{color:#F5B400;font-size:13px;letter-spacing:1px}
.line-reveal{overflow:hidden;display:block}
.line-reveal>span{display:block}

/* ================= CAP 2: PERGUNTAS ================= */
#pedido{background:var(--plum);color:#fff;padding:14vh 6vw;overflow:hidden}
#pedido .inner{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:1.1fr .9fr;gap:5vw;align-items:start}
#pedido .chap{color:var(--yellow)}
#pedido h2{font-family:var(--ff-d);font-weight:400;font-size:clamp(32px,4.4vw,60px);line-height:1.05;margin:16px 0 10px}
#pedido h2 em{color:var(--pink)}
#pedido .lead{color:rgba(255,255,255,.7);max-width:520px;margin-bottom:34px}
.q{border-top:1px solid rgba(255,255,255,.12);padding:22px 0}
.q h3{font-weight:500;font-size:18px;display:flex;gap:12px;align-items:baseline;margin-bottom:14px}
.q h3 small{font-family:var(--ff-d);font-style:italic;color:var(--yellow);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{appearance:none;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.04);color:#fff;font:inherit;font-size:15px;
  padding:11px 18px;border-radius:999px;cursor:pointer;transition:all .25s ease}
.chip:hover{border-color:var(--pink);background:rgba(227,108,192,.12)}
.chip.on{background:var(--pink);border-color:var(--pink);color:#fff;transform:translateY(-1px);box-shadow:0 8px 24px -8px rgba(227,108,192,.8)}
.ticket{position:sticky;top:96px;background:var(--cream);color:var(--ink);border-radius:26px;padding:30px 28px 26px;overflow:hidden;
  box-shadow:0 40px 80px -40px rgba(0,0,0,.6)}
.ticket::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;
  background:linear-gradient(90deg,var(--red),var(--orange),var(--yellow),var(--lime),var(--blue),var(--purple),var(--pink))}
.ticket .t-k{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.ticket h4{font-family:var(--ff-d);font-weight:400;font-size:30px;line-height:1.1;margin:8px 0 18px}
.ticket h4 em{color:var(--pinkd)}
.trow{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px dashed rgba(42,23,51,.18);font-size:15px}
.trow span{color:var(--muted)}
.trow b{font-weight:600;text-align:right}
.trow b.empty{color:#c9bccb;font-weight:400;font-style:italic}
.trow b.pop{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.tbtns{display:grid;gap:10px;margin-top:22px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;font-weight:600;font-size:16px;padding:16px 20px;border-radius:16px;transition:transform .2s, box-shadow .2s;border:0;cursor:pointer;font-family:inherit}
.btn:hover{transform:translateY(-2px)}
.btn.wa{background:var(--wa);color:#fff;box-shadow:0 14px 30px -14px rgba(37,211,102,.9)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid rgba(42,23,51,.18)}
.ticket .fine{font-size:12px;color:var(--muted);text-align:center;margin-top:12px}
.meter{height:6px;border-radius:9px;background:#efe4ea;margin-bottom:6px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--yellow));transition:width .5s ease}

/* ================= CAP 3: O DIA (horizontal) ================= */
#dia{background:var(--cream2);overflow:hidden}
.dia-head{padding:14vh 6vw 4vh;max-width:1300px;margin:0 auto}
.dia-head h2{font-family:var(--ff-d);font-weight:400;font-size:clamp(32px,4.6vw,62px);line-height:1.05;margin-top:16px}
.dia-head h2 em{color:var(--limed)}
.track-wrap{height:100vh;height:100svh;display:flex;align-items:center}
.track{display:flex;gap:28px;padding:0 6vw;will-change:transform}
.card{flex:none;width:min(78vw,430px);height:min(66vh,540px);border-radius:30px;padding:30px;position:relative;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:flex-end}
.card .n{position:absolute;top:24px;left:30px;font-family:var(--ff-d);font-style:italic;font-size:18px;opacity:.85}
.card .art{position:absolute;top:0;left:0;right:0;height:58%;display:grid;place-items:center}
.card h3{font-family:var(--ff-d);font-weight:600;font-size:clamp(26px,2.4vw,34px);line-height:1.05;margin-bottom:10px}
.card p{font-size:15.5px;opacity:.92}
.card ul{list-style:none;display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.card li{font-size:13px;background:rgba(255,255,255,.18);padding:6px 11px;border-radius:999px}
.c1{background:linear-gradient(160deg,#E36CC0,#A9418E)}
.c2{background:linear-gradient(160deg,#7FB540,#4E8420)}
.c3{background:linear-gradient(160deg,#F2B544,#D9762C)}
.c4{background:linear-gradient(160deg,#6AAEE0,#3E73B8)}
.c5{background:linear-gradient(160deg,#8A62B3,#4E2C70)}
.card .shade{position:absolute;inset:0;background:#1a0510;opacity:0;pointer-events:none;border-radius:inherit;z-index:3}
.card.end{background:var(--plum);justify-content:center;text-align:left}
.card.end h3{font-size:clamp(28px,2.8vw,40px)}
.card.end .btn{margin-top:22px}


/* ================= CAP 4: REALIZADOS ================= */
#realizados{padding:16vh 6vw 10vh;max-width:1300px;margin:0 auto}
.real-head{max-width:760px;margin-bottom:10vh}
.real-head h2{font-family:var(--ff-d);font-weight:400;font-size:clamp(32px,4.6vw,62px);line-height:1.05;margin:16px 0 14px}
.real-head h2 em{color:var(--pinkd)}
.real-head p{color:var(--muted);font-size:clamp(16px,1.4vw,19px)}
.story{display:grid;grid-template-columns:1.1fr .9fr;gap:6vw;align-items:center;margin-bottom:16vh}
.story.rev{grid-template-columns:.9fr 1.1fr}
.story.rev .ph{order:2}
.ph{position:relative}
.frame{position:relative;border-radius:28px;overflow:hidden;aspect-ratio:4/5;clip-path:inset(10% 10% 10% 10% round 28px);will-change:clip-path}
.frame img{width:100%;height:100%;object-fit:cover;transform:scale(1.25);will-change:transform}
.frame.wide{aspect-ratio:5/4}
.mini{position:absolute;width:44%;right:-6%;bottom:-10%;border-radius:22px;overflow:hidden;aspect-ratio:3/4;border:6px solid var(--cream);box-shadow:0 30px 60px -30px rgba(42,23,51,.5)}
.mini img{width:100%;height:100%;object-fit:cover}
.stxt .tag{display:inline-flex;gap:8px;align-items:center;font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;padding:7px 14px;border-radius:999px;background:#fff;box-shadow:0 8px 20px -14px rgba(42,23,51,.4)}
.stxt .tag i{width:8px;height:8px;border-radius:50%;display:block}
.stxt h3{font-family:var(--ff-d);font-weight:400;font-size:clamp(30px,3.4vw,48px);line-height:1.05;margin:18px 0 14px}
.stxt h3 em{color:var(--pinkd)}
.stxt p{color:#4d3d55;font-size:clamp(16px,1.3vw,18px);max-width:440px}
.stxt .num{font-family:var(--ff-d);font-style:italic;font-size:15px;color:var(--muted);display:block;margin-bottom:16px}
.real-end{text-align:center;padding-top:2vh}
.real-end h3{font-family:var(--ff-d);font-weight:400;font-size:clamp(30px,4vw,54px);line-height:1.05;margin-bottom:24px}
.real-end h3 em{color:var(--pinkd)}
.real-end .btn{display:inline-flex;min-width:280px}
@media (max-width:900px){
  .story,.story.rev{grid-template-columns:1fr;gap:34px;margin-bottom:12vh}
  .story.rev .ph{order:0}
  .mini{right:-2%;bottom:-8%;width:40%}
  .story.pair{margin-bottom:16vh}
}

/* ================= CAP 5: AVALIAÇÕES ================= */
#avaliacoes{padding:16vh 6vw;max-width:1300px;margin:0 auto}
.rate-hero{display:grid;grid-template-columns:auto 1fr;gap:5vw;align-items:center}
.big{font-family:var(--ff-d);font-weight:600;font-size:clamp(110px,17vw,240px);line-height:.85;letter-spacing:-.04em;
  background:linear-gradient(120deg,var(--pinkd),var(--purple) 50%,var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.starbar{position:relative;display:inline-block;font-size:clamp(28px,3vw,40px);letter-spacing:4px;color:#e6dbe3;margin-top:12px}
.starbar i{position:absolute;inset:0;width:0;overflow:hidden;color:#F5B400;font-style:normal;white-space:nowrap}
.g-badge{display:inline-flex;align-items:center;gap:10px;background:#fff;border-radius:999px;padding:8px 16px 8px 10px;font-size:14px;font-weight:500;box-shadow:0 10px 30px -18px rgba(42,23,51,.4);margin-top:18px}
.rate-hero h2{font-family:var(--ff-d);font-weight:400;font-size:clamp(30px,3.8vw,52px);line-height:1.08;margin:16px 0 10px}
.rate-hero h2 em{color:var(--pinkd)}
.rate-hero p{color:var(--muted);max-width:520px}
.reviews{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;margin-top:9vh;max-width:980px;margin-left:auto;margin-right:auto}
.review{background:#fff;border-radius:24px;padding:28px 26px;box-shadow:0 1px 0 rgba(42,23,51,.05),0 24px 50px -30px rgba(42,23,51,.35);display:flex;flex-direction:column}
.review .rs{color:#F5B400;letter-spacing:2px;font-size:16px}
.review blockquote{font-family:var(--ff-d);font-size:19px;line-height:1.38;margin:14px 0 22px;flex:1}
.review .who{display:flex;align-items:center;gap:12px}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600}
.review .who b{display:block;font-size:15px}
.review .who small{color:var(--muted);font-size:12.5px}
.more{display:flex;justify-content:center;margin-top:40px}
.more a{font-weight:600;text-decoration:none;border-bottom:2px solid var(--pink);padding-bottom:3px}

/* ================= CAP 5: FINAL ================= */
#final{background:var(--plum);color:#fff;min-height:100vh;min-height:100svh;display:grid;place-items:center;text-align:center;padding:14vh 6vw 10vh;overflow:hidden}
#final .glow{top:62%}
#final .wrap{position:relative;z-index:2;max-width:820px}
#final h2{font-family:var(--ff-d);font-weight:400;font-size:clamp(36px,6vw,82px);line-height:1.02;margin:16px 0}
#final h2 em{color:var(--yellow)}
#final p.sub{color:rgba(255,255,255,.72);font-size:clamp(16px,1.5vw,19px);max-width:560px;margin:0 auto}
.cake{position:relative;width:min(440px,84vw);margin:38px auto 32px;border-radius:30px;overflow:hidden;box-shadow:0 50px 100px -40px rgba(255,150,80,.35),0 0 0 1px rgba(255,255,255,.08)}
.cake img{width:100%;transition:filter 1.2s ease}
.cake .fl,.cake .off,.cake .sm{position:absolute;transform:translate(-50%,-50%);pointer-events:none;border-radius:50%}
.cake .fl{width:22%;aspect-ratio:1;background:radial-gradient(circle,rgba(255,210,130,.6),rgba(255,150,60,.15) 45%,transparent 70%);mix-blend-mode:screen;animation:breathe2 1.8s ease-in-out infinite;transition:opacity .4s}

@keyframes breathe2{0%,100%{opacity:.7;transform:translate(-50%,-50%) scale(1)}40%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}}
.cake .off{width:7%;height:12%;background:radial-gradient(ellipse,rgb(58,11,27) 45%,rgba(58,11,27,.9) 60%,transparent 78%);opacity:0;transition:opacity .3s ease-in}
.cake .dim{position:absolute;left:50%;top:12%;width:55%;height:26%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(ellipse,rgba(50,9,24,.8),rgba(50,9,24,.4) 50%,transparent 72%);opacity:0;transition:opacity .6s ease;pointer-events:none}
.cake.out .dim{opacity:1}
.cake .sm{width:3.5%;height:7%;background:radial-gradient(ellipse,rgba(190,180,195,.45),transparent 70%);opacity:0;filter:blur(1.5px)}
.cake.out .fl{opacity:0}
.cake.out .off{opacity:1}
.cake.out img{filter:brightness(.72) saturate(.9)}
.cake.out .sm{animation:smoke 2.2s ease-out forwards}
.cake.out .sm.s2{animation-delay:.25s}.cake.out .sm.s3{animation-delay:.5s}
@keyframes smoke{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}15%{opacity:.7}100%{opacity:0;transform:translate(-20%,-220%) scale(1.8,2.4)}}
.final-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.final-btns .btn{min-width:260px}
.btn.light{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.22)}
.addr{margin-top:46px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;text-align:left}
.addr div{border-top:1px solid rgba(255,255,255,.15);padding-top:14px;font-size:14.5px;color:rgba(255,255,255,.8)}
.addr b{display:block;font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--pink);margin-bottom:6px;font-weight:600}
.addr a{text-decoration:none}
footer{background:#170a1d;color:rgba(255,255,255,.45);text-align:center;font-size:12.5px;padding:26px 20px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:120}

/* floating wa */
.fab{position:fixed;right:18px;bottom:18px;z-index:95;width:60px;height:60px;border-radius:50%;background:var(--wa);display:grid;place-items:center;
  box-shadow:0 14px 34px -10px rgba(37,211,102,.8);transform:scale(0);transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
.fab.show{transform:scale(1)}
.fab svg{width:30px;height:30px}
.fab::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--wa);animation
